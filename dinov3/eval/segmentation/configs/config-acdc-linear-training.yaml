# Config for ACDC, linear training
# Training on: Fog + Reference (Clear) images
# Validating on: Fog images

bs: 8                 # Batch size
n_gpus: 2             # Matched to your logs (world size=1)
metric_to_save: 'mIoU'
model_dtype: FLOAT32

scheduler:
  total_iter: 4000
  type: 'WarmupOneCycleLR'
  constructor_kwargs:
    warmup_iters: 250
    warmup_ratio: 1e-6
    final_div_factor: .inf
    pct_start: 0
    anneal_strategy: 'cos'
    use_beta1: False
    update_momentum: False

optimizer:
  lr : 1e-3
  beta1: 0.9
  beta2: 0.999
  weight_decay: 1e-3
  gradient_clip: 'inf'

datasets:
  root: "/home/shai/datasets/ACDC"

  # TRAIN: Load 'fog' split AND its corresponding 'train_ref' images
  train: "ACDC:split=TRAIN_REF"

  # VAL: Validate only on the adverse condition (standard benchmark practice)
  val: "ACDC:split=VAL"

train:
  diceloss_weight: 0.0
  celoss_weight: 1.0

decoder_head:
  type: "linear"
  backbone_out_layers: LAST
  use_cls_token: False
  use_batchnorm: True
  use_backbone_norm: True
  num_classes: 19            # ACDC uses Cityscapes classes

transforms:
  train:
    img_size: [512, 1024]    # Resize to standard resolution
    random_img_size_ratio_range: [0.5, 2.0]
    crop_size: [512, 1024]
    flip_prob: 0.5
  eval:
    img_size: [512, 1024]

eval:
  compute_metric_per_image: False
  reduce_zero_label: False   # ACDC uses 255 for void, not 0.
  mode: "slide"
  crop_size: [512, 1024]
  stride: [341, 682]
  eval_interval: 500
  use_tta: False

wandb:
  project: "dinov3-acdc-linear"
  name: "train-acdc-ref"
  enabled: True